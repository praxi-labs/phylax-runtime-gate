name: Scorecard

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: '41 5 * * 2'
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: Analysis
    uses: praxi-labs/ci/.github/workflows/scorecard.yml@v1
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
