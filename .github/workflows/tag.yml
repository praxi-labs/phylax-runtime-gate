name: Tag

on:
  push:
    branches: [main]

permissions: {}

jobs:
  tag:
    name: Tag
    uses: praxi-labs/ci/.github/workflows/auto-tag.yml@v1
    with:
      version-path: package.json
    permissions:
      contents: write

  publish:
    name: Publish to npm
    needs: tag
    if: needs.tag.outputs.tagged == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use an npm that supports trusted publishing
        run: npm install --global npm@latest

      - name: Refuse to publish a local path as a runtime dependency
        run: |
          set -euo pipefail
          offenders="$(node -e '
            const pkg = require("./package.json");
            const bad = [];
            for (const section of ["dependencies", "peerDependencies", "optionalDependencies"]) {
              for (const [name, spec] of Object.entries(pkg[section] || {})) {
                if (/^(file:|link:|\.{1,2}\/)/.test(String(spec))) {
                  bad.push(section + ": " + name + " -> " + spec);
                }
              }
            }
            process.stdout.write(bad.join("\n"));
          ')"
          if [ -n "$offenders" ]; then
            echo "::error::These resolve to a path on the build machine:"
            echo "$offenders"
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build --if-present

      - name: Skip when this version is already on the registry
        id: already
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already published"
            echo "published=yes" >> "$GITHUB_OUTPUT"
          else
            echo "published=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.already.outputs.published == 'no'
        run: npm publish --provenance --access public
