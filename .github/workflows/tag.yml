name: Tag

on:
  push:
    branches: [main]

permissions: {}

jobs:
  tag:
    name: Tag
    uses: praxi-labs/ci/.github/workflows/auto-tag.yml@v1
    with:
      version-path: package.json
    permissions:
      contents: write

  publish:
    name: Publish
    needs: tag
    if: needs.tag.outputs.tagged == 'true'
    uses: praxi-labs/ci/.github/workflows/npm-publish.yml@v1
    permissions:
      contents: read
      id-token: write
